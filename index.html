<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111522" />
    <title>Solace OS</title>
    <link rel="stylesheet" href="css/desktop.css" />
  </head>
  <body>
    <main id="os" class="os-shell">
      <section id="boot-screen" class="boot-screen" aria-label="Solace OS boot screen">
        <div class="boot-content">
          <div class="logo-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <p class="wordmark">solace</p>
          <p class="boot-status"><i></i> system ready</p>
          <p class="boot-prompt">Press <kbd>Space</kbd> to boot</p>
        </div>
      </section>

      <section id="desktop" class="desktop" aria-label="Desktop">
        <div class="desktop-glow glow-one"></div>
        <div class="desktop-glow glow-two"></div>
        <p class="desktop-label">Solace OS</p>
        <div class="dock-space" aria-label="Dock placeholder"></div>
      </section>
    </main>

    <script src="js/core/state.js"></script>
    <script src="js/core/Desktop.js"></script>
    <script src="js/core/Boot.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
